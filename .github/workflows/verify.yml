name: exact-verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exact replay
        run: python -B verify.py --report verification_report_ci.json
      - name: Mutation controls
        run: python -B test_mutations.py
      - name: Mixed-theorem regression
        run: python -B verify_mixed_extension.py
      - name: Optimized replay
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -O -B verify.py --report verification_report_ci_optimized.json
      - name: Optimized mutation controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -O -B test_mutations.py
      - name: Optimized mixed-theorem regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -O -B verify_mixed_extension.py
